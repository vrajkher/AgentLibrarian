[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-librarian"
version = "0.1.0"
description = "Universal retrieval, ranking and context packaging layer for AI agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "vrajkher"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
